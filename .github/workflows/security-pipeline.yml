

name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - master
      - IT24100502-cicd-security

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

 
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep:1.176.0 \
            semgrep scan --config=auto /src


 
  dependency-scan:
    name: Dependency Scan - npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run npm audit
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=critical


  
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify ZAP API key secret injection
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
        run: |
          test -n "$ZAP_API_KEY"
          echo "ZAP_API_KEY injected securely"

      - name: Run Gitleaks secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            dir /repo --redact --verbose


 
  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build NodeGoat Docker image
        run: |
          docker build \
            -t nodegoat-it24100502:${{ github.sha }} .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nodegoat-it24100502:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: "0"
